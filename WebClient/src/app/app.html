  <div id="logo">
    <div id="logo-left">
      <label id="labelnome">Loccioni</label>
      <label id="labeltype">Analisys</label>
    </div>
    <div id="logo-right">
      <label id="labelversion">Analisys v.1.0.0</label>
      <label id="labelauthors">a.fiorentini</label>
    </div>
  </div>

  <div class="filters">

    <div class="search-box">

      <div id="textboxinput">

        <div class="field">  
        <label id="lblDummyCode">DummyCode :</label>
        <input #textDummyCode type="text" placeholder="">
        </div>        

        <div class="field">  
        <label id="lblmodelcode">Model Code :</label>
        <input #textmodelcode type="text" placeholder="">
        </div>

        <div class="field">  
        <label id="lblprogrcode">Program Code :</label>
        <input id="textprogrcode" type="text" placeholder="">
        </div>

        <div class="field">  
        <label id="lblprogrdescr">Program Description :</label>
        <input id="textprogrdescr" type="text" placeholder="">
        </div>

        <div class="field">  
        <label id="lbldefects">Defect :</label>
        <input id="textdefects" type="text" placeholder="">
        </div>
        
        <div class="field">  
        <label id="lblfailfunction">Fail Function :</label>
        <input id="textfailfunction" type="text" placeholder="">
        </div>        
        
      </div>

      <div id="comboboxinput">

        <div class="selectbox">
          <label id="lblshiftselect">Shift :</label>
          <select id="shiftselectbox">
          <option value="0-All">All</option>
            @for (item of filters; track $index) {
              @if (item.name === "Shift") {
                @if(item.type ==="number") {
                  @for (value of item.values; track $index) {
                    <option [value]="value"> {{value}} </option>
                  }
                }
              }
            }
          </select>
        </div>        

        <div class="selectbox">
          <label id="lbllineselect">Lines :</label>
          <select id="lineselectbox">
            <option value="0-All">All</option>
            @for (item of filters; track $index) {
              @if (item.name === "Line") {
                @if(item.type ==="string") {
                  @for (value of item.values; track $index) {
                    <option [value]="value"> {{value}} </option>
                  }
                }
              }
            }
          </select>
        </div>

        <div class="selectbox">
          <label id="lblutselect">Unit Type :</label>
          <select id="utselectbox">
            <option value="0-All">All</option>
            @for (item of filters; track $index) {
              @if (item.name === "Unit Type") {
                @if(item.type ==="string") {
                  @for (value of item.values; track $index) {
                    <option [value]="value"> {{value}} </option>
                  }
                }
              }
            }
          </select>
        </div>

        <div class="selectbox">
          <label id="lblunselect">Unit :</label>
          <select id="unselectbox">
            <option value="0-All">All</option>
            @for (item of filters; track $index) {
              @if (item.name === "Units") {
                @if(item.type ==="string") {
                  @for (value of item.values; track $index) {
                    <option [value]="value"> {{value}} </option>
                  }
                }
              }
            }
          </select>
        </div> 
        
        <div class="selectbox">
          <label id="lblresselect">Result :</label>
          <select id="resselectbox">
            <option value="0-All">All</option>
            @for (item of filters; track $index) {
              @if (item.name === "Result") {
                @if(item.type ==="string") {
                  @for (value of item.values; track $index) {
                    <option [value]="value"> {{value}} </option>
                  }
                }
              }
            }
          </select>
        </div>         

      </div>

      <div id="textboxdate">

          <div id="dategroup">
              <div class="fieldDate">  
                <label id="lbldatestart">Start Date :</label>
                <input id="txtdatestart" type="datetime-local" [(ngModel)]="DateFormat">
              </div>

              <div class="fieldDate">  
                <label id="lbldateend">End Date :</label>
                <input id="txtdateend" type="datetime-local" [(ngModel)]="DateFormat">
              </div>
          </div>

          <div id="buttonbox">
            <button class="btn-search">🔍 Search</button>
            <button class="btn-graph">📊 Graph</button>
          </div>

      </div>

    </div>
 
  </div>
