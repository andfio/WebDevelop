<div class="dialog-title" mat-dialog-title>
  {{ DialogTitle }}
</div>

<div class="dialog-container" >  

    <div class="dialog-content">
      <mat-dialog-content>
          <div class="label-title">
            <label id="measuretitle">Measures: </label>
            <label id="colortitle">Color Plots: </label>
            <label id="visibletitle">Visible: </label>
          </div>

          @for(itemMeasure of axesConfig.plots[UnitTypeIDSelected].Plot; track $index) {
                <div class="row-container">
                    <div class="measurebox">
                        <select [(ngModel)]="chartSettings.measure[$index]">
                          <option [ngValue]="-2"> none </option>
                          @for (item of measuresInfo; track item.measureID) {
                              <option [ngValue]="item.measureID"> {{item.shortname}} </option>
                          }
                        </select>
                    </div>

                    @if(axesConfig.plotcolors[UnitTypeIDSelected].Color[$index]; as itemColor) {
                      <div class="colorbox">

                        <select [(ngModel)]="chartSettings.plotcolor[$index]">
                          <option [ngValue]="'#FFFFFF'" > none </option>
                          @for (item of colorItems; track item) {
                            <option [ngValue]="item" [style.background-color]="item"> {{colorMap[item]}} </option>
                          }
                        </select>
                    
                      </div>
                    }        
                    
                    <div class="enablebox">
                      <mat-checkbox
                        [checked]="axesConfig.visibleplots[UnitTypeIDSelected].Plot[$index] != 0"
                        (change)="chartSettings.enableplot[$index] = $event.checked">
                      </mat-checkbox>
                    </div>
              </div>
              
          }

          <mat-dialog-actions align="end">
            <button class="dialog-button" matButton cdkFocusInitial (click)="saveSettings()">Save</button>
            <button class="dialog-button" matButton (click)="closeDialog()">Cancel</button>
          </mat-dialog-actions>          

      </mat-dialog-content>
    </div>

</div>
