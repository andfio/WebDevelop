<div class="chart-container">
  
  <div class="chart-wrapper">
    <apx-chart
       #chartObj
      [series]="series"
      [chart]="chart"
      [dataLabels]="dataLabels"
      [markers]="markers"
      [title]="title"
      [fill]="fill"
      [yaxis]="yaxis"
      [xaxis]="xaxis"
      [tooltip]="tooltip"
      [autoUpdateSeries]="true"
      [stroke]="stroke"
      [grid]="grid"
      [legend]="legend"
    ></apx-chart>
  </div>

  <div class="chart-details-container">
    <div class="chart-details"> 
      <div class="AxisX" style="text-align:center">Axes X (Time (sec))
        <div class="inline-slider"> 
            <mat-slider
              class="matSlider"
              [min]="AxisValues[0].min"
              [max]="AxisValues[0].max"
              [step]="(AxisValues[0].max - AxisValues[0].min) / 100"
              showTickMarks
              discrete
              [displayWith]="formatLabel"
              (change)="subShowAxisValues(sliderX.value, 0, 'slider')">
              <input matSliderThumb [(ngModel)]="AxisValues[0].value" #sliderX>
            </mat-slider>        
            <div class="buttonReset" (click)="subResetSliders(0)"><i class="material-symbols-outlined" height="20" width="20">Home</i></div>
          </div> 
      </div>
  

      <div class="AxisX-container">
        <div class ="AxisX-Content">
           <span class="inline-field">
              <label class="label">min: </label>
              <input type="number"
                     oninput="if (this.value.length > 6) this.value = this.value.slice(0, 6);" 
                     onkeydown="return ['Backspace','Delete','ArrowLeft','ArrowRight','Tab'].includes(event.code) || /[0-9.]/.test(event.key)"
                     (change)="subShowAxisMinValue(AxisValues[0].textMin, 0)" 
                     [(ngModel)]="AxisValues[0].textMin">
          </span>
        </div>
        <div class ="AxisX-Content">
            <span class="inline-field">
              <label class="label">max: </label>
              <input type="number"
                     oninput="if (this.value.length > 6) this.value = this.value.slice(0, 6);" 
                     onkeydown="return ['Backspace','Delete','ArrowLeft','ArrowRight','Tab'].includes(event.code) || /[0-9.]/.test(event.key)" 
                     (change)="subShowAxisValues(AxisValues[0].textMax, 0, 'input')"
                     [(ngModel)]="AxisValues[0].textMax">
          </span>
        </div>  
      </div>
      
      @if(this.AxisValues[1].enabled) {
        <div class="AxisY" style="text-align:center">Axes 1° Left
          <div class="inline-slider"> 
            <mat-slider
              class="matSlider"
              [min]="AxisValues[1].min"
              [max]="AxisValues[1].max"
              [step]="(AxisValues[1].max - AxisValues[1].min) / 100"
              showTickMarks
              discrete
              [displayWith]="formatLabel" 
              (change)="subShowAxisValues(sliderY1.value, 1, 'slider')">
              <input matSliderThumb [(ngModel)]="AxisValues[1].value" #sliderY1>
            </mat-slider>        
            <div class="buttonReset" (click)="subResetSliders(1)"><i class="material-symbols-outlined" height="20" width="20">Home</i></div>
          </div>
        </div>
         
        <div class="AxisY-container">
          <div class ="AxisY-Content">
            <span class="inline-field">
                <label class="label">min: </label>
                <input type="number" 
                     oninput="if (this.value.length > 6) this.value = this.value.slice(0, 6);" 
                     onkeydown="return ['Backspace','Delete','ArrowLeft','ArrowRight','Tab'].includes(event.code) || /[0-9.]/.test(event.key)" 
                     (change)="subShowAxisMinValue(AxisValues[1].textMin, 1)" 
                     [(ngModel)]="AxisValues[1].textMin">
            </span>
          </div>
          <div class ="AxisY-Content">
            <span class="inline-field">
                <label class="label">max: </label>
                <input type="number" 
                     oninput="if (this.value.length > 6) this.value = this.value.slice(0, 6);" 
                     onkeydown="return ['Backspace','Delete','ArrowLeft','ArrowRight','Tab'].includes(event.code) || /[0-9.]/.test(event.key)" 
                     (change)="subShowAxisValues(AxisValues[1].textMax, 1, 'input')"
                     [(ngModel)]="AxisValues[1].textMax">
            </span>
          </div>  
        </div>
      }

      @if(this.AxisValues[2].enabled) {
        <div class="AxisY" style="text-align:center">Axes 2° Left
          <div class="inline-slider"> 
            <mat-slider
              class="matSlider"
              [min]="AxisValues[2].min"
              [max]="AxisValues[2].max"
              [step]="(AxisValues[2].max - AxisValues[2].min) / 100"

              (change)="subShowAxisValues(sliderY2.value, 2, 'slider')">

            </mat-slider>        
            <div class="buttonReset"(click)="subResetSliders(2)"><i class="material-symbols-outlined" height="20" width="20">Home</i></div>
          </div>
        </div> 

        <div class="AxisY-container">
          <div class ="AxisY-Content">
            <span class="inline-field">
                <label class="label">min: </label>
                <input type="number" 
                      oninput="if (this.value.length > 6) this.value = this.value.slice(0, 6);" 
                      onkeydown="return ['Backspace','Delete','ArrowLeft','ArrowRight','Tab'].includes(event.code) || /[0-9.]/.test(event.key)" 
                      (change)="subShowAxisMinValue(AxisValues[2].textMin, 2)" 
                      [(ngModel)]="AxisValues[2].textMin">
            </span>
          </div>
          <div class ="AxisY-Content">
            <span class="inline-field">
                <label class="label">max: </label>
                <input type="number" 
                      oninput="if (this.value.length > 6) this.value = this.value.slice(0, 6);" 
                      onkeydown="return ['Backspace','Delete','ArrowLeft','ArrowRight','Tab'].includes(event.code) || /[0-9.]/.test(event.key)" 
                      (change)="subShowAxisValues(AxisValues[2].textMax, 2, 'input')"
                      [(ngModel)]="AxisValues[2].textMax">
            </span>
          </div>  
        </div>
      }

      @if(this.AxisValues[3].enabled) {
        <div class="AxisY" style="text-align:center">Axes 1° Right
          <div class="inline-slider"> 
            <mat-slider
              class="matSlider"
              [min]="AxisValues[3].min"
              [max]="AxisValues[3].max"
              [step]="(AxisValues[3].max - AxisValues[3].min) / 100"

              [displayWith]="formatLabel"
              (change)="subShowAxisValues(sliderY3.value, 3, 'slider')">
              <input matSliderThumb [(ngModel)]="AxisValues[3].value" #sliderY3>
            </mat-slider>        
            <div class="buttonReset"(click)="subResetSliders(3)"><i class="material-symbols-outlined" height="20" width="20">Home</i></div>
          </div>
        </div> 

        <div class="AxisY-container">
          <div class ="AxisY-Content">
            <span class="inline-field">
                <label class="label">min: </label>
                <input type="number" 
                     oninput="if (this.value.length > 6) this.value = this.value.slice(0, 6);" 
                     onkeydown="return ['Backspace','Delete','ArrowLeft','ArrowRight','Tab'].includes(event.code) || /[0-9.]/.test(event.key)" 
                     (change)="subShowAxisMinValue(AxisValues[3].textMin, 3)" 
                     [(ngModel)]="AxisValues[3].textMin">
            </span>
          </div>
          <div class ="AxisY-Content">
            <span class="inline-field">
                <label class="label">max: </label>
              <input type="number" 
                     oninput="if (this.value.length > 6) this.value = this.value.slice(0, 6);" 
                     onkeydown="return ['Backspace','Delete','ArrowLeft','ArrowRight','Tab'].includes(event.code) || /[0-9.]/.test(event.key)" 
                     (change)="subShowAxisValues(AxisValues[3].textMax, 3, 'input')"
                     [(ngModel)]="AxisValues[3].textMax">
            </span>
          </div>  
        </div>      
      }
