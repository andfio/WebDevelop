<div class="chart-container">
  
  <div class="chart-wrapper">
    <apx-chart
       #chartObj
      [series]="series"
      [chart]="chart"
      [dataLabels]="dataLabels"
      [markers]="markers"
      [title]="title"
      [fill]="fill"
      [yaxis]="yaxis"
      [xaxis]="xaxis"
      [tooltip]="tooltip"
      [autoUpdateSeries]="true"
      [stroke]="stroke"
      [grid]="grid"
      [legend]="legend"
    ></apx-chart>
  </div>

  <div class="chart-details-container">
    <div class="chart-details"> 

       <div class="AxisX" style="text-align:center">Axis X (Time (sec))
        <mat-slider
          class="matSlider"
          [min]="DataPoint[0].time[0]"
          [max]="DataPoint[0].time[DataPoint[0].time.length - 1]"
          [step]="1"
          showTickMarks
          discrete >
          <input matSliderThumb [value]="8.1" (change)="formatLabel(10)">
        </mat-slider>
      </div>
