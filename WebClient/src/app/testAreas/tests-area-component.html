<div class="chart-wrapper" id="chartWrapper">
    <apx-chart class="apx-chart"
      #chartObj
      [series]="series"
      [chart]="chart"
      [dataLabels]="dataLabels"
      [markers]="markers"
      [title]="title"
      [fill]="fill"
      [yaxis]="yaxis"
      [xaxis]="xaxis"
      [tooltip]="tooltip"
      [autoUpdateSeries]="true"
      [stroke]="stroke"
      [grid]="grid"
      [legend]="legend"
      [plotOptions]="plotOptions"
    ></apx-chart>     
</div>
