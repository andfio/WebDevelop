<div class="tables-container">

    <!-- LABEL ROOT ESTERNA ALLA TABELLA -->
    <div class="root-label" (click)="subShowRoot()">
        {{ row['SerialNumber'] }}
    </div>

    <div class="table-wrapper">

        <table class="tablemaindetails">
            <tbody>

                @for(itemRow of results; track $index)
                {
                    <tr>
                        <td id="Progress">{{ itemRow['ProgressiveGroup'] }}</td>

                        <td id="Icon">
                            @switch (typeIcon[itemRow['TestType']]) {
                                @case (1) { <img src="img/Measure.ico" width="32" height="32"> }
                                @case (2) { <img src="img/Actionament.ico" width="32" height="32"> }
                                @case (5) { <img src="img/SafetyTest.ico" width="32" height="32"> }
                                @default  { <img src="img/ComplexTest.ico" width="32" height="32"> }
                            }
                        </td>

                        <td id="TestDescription">{{ itemRow['TestDescription'] }}</td>
                    </tr>
                }

            </tbody>
        </table>

    </div>
</div>
